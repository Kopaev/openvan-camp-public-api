      type: object
      description: Current-day weather snapshot used for van scoring.
      properties:
        temp_day:
          type: number
          description: Daytime air temperature in °C.
          nullable: true
        temp_night:
          type: number
          description: Nighttime air temperature in °C.
          nullable: true
        feels_like_day:
          type: number
          nullable: true
        feels_like_night:
          type: number
          nullable: true
        temp_current:
          type: number
          nullable: true
        feels_like_current:
          type: number
          nullable: true
        precip_sum:
          type: number
          description: Total precipitation in mm.
          nullable: true
        precip_prob_max:
          type: number
          description: Max precipitation probability in %.
          nullable: true
        wind_max:
          type: number
          description: Max sustained wind km/h.
          nullable: true
        wind_gusts_max:
          type: number
          description: Max wind gust km/h.
          nullable: true
        wind_dir:
          type: number
          description: Wind direction in degrees.
          nullable: true
        shortwave_radiation_sum:
          type: number
          nullable: true
        peak_sun_hours:
          type: number
          description: Effective sunlight hours for solar panels.
          nullable: true
        uv_max:
          type: number
          nullable: true
        sunrise:
          type: string
          format: date-time
          nullable: true
        sunset:
          type: string
          format: date-time
          nullable: true
        weather_code:
          type: integer
          description: WMO weather code.
          nullable: true
        humidity:
          type: number
          nullable: true
        cloud_cover:
          type: number
          nullable: true
    VanSkyMarine:
      type: object
      description: Marine data for coastal countries; null for landlocked.
      properties:
        sea_temp:
          type: number
          description: Sea temperature in °C.
          nullable: true
        wave_height:
          type: number
          description: Wave height in meters.
          nullable: true
        wave_dir:
          type: number
          description: Wave direction in degrees.
          nullable: true
        wave_period:
          type: number
          description: Wave period in seconds.
          nullable: true
    VanSkyForecastDay:
      type: object
      description: Single forecast day snapshot.
      properties:
        date:
          type: string
          format: date
        van_score:
          type: integer
          description: Overall vanlife suitability 0-100.
          minimum: 0
          maximum: 100
        sleep_score:
          type: integer
          description: Overnight comfort 0-100.
          minimum: 0
          maximum: 100
        temp_day:
          type: number
          nullable: true
        temp_night:
          type: number
          nullable: true
        solar_kwh:
          type: number
          description: Estimated solar energy kWh/day per 1kW panel.
          nullable: true
        weather_code:
          type: integer
          nullable: true
        score_label:
          type: string
          enum:
          - ideal
          - comfortable
          - acceptable
          - harsh
          - extreme
        drive_score:
          type: integer
          minimum: 0
          maximum: 100
    VanSkyRecommendation:
      type: object
      properties:
        type:
          type: string
          enum:
          - info
          - warning
          - danger
          - tip
        key:
          type: string
          description: Translation key, e.g. vansky.rec.awning_caution.
        params:
          type: object
          additionalProperties: true
          description: Numeric params for the translated message.
    VanSkyCountry:
      type: object
      properties:
        code:
