        sleep_score:
          type: integer
          minimum: 0
          maximum: 100
        solar_kwh:
          type: number
          description: Today's solar yield estimate.
          nullable: true
        solar_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        drive_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        sea_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        score_label:
          type: string
          enum:
          - ideal
          - comfortable
          - acceptable
          - harsh
          - extreme
